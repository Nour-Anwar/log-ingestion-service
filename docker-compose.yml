services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/log_service
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
 
  postgres:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_service
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=700MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=512MB
      - -c
      - checkpoint_timeout=10min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - wal_buffers=16MB
      - -c
      - full_page_writes=off
      - -c
      - bgwriter_lru_maxpages=1000
      - -c
      - bgwriter_delay=10ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    cpus: 1
    mem_limit: 1g
 
volumes:
  postgres_data:
 
